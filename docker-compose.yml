# API + photo storage on one machine, behind the host's nginx (deploy/README.md). Setup and
# operation: deploy/docker/README.md. Nothing is reachable from outside except through nginx:
# both ports are published on 127.0.0.1 only.
name: hamtning

services:
  api:
    build:
      context: .
      target: api
    image: hamtning-api:${TAG:-latest}
    restart: unless-stopped
    env_file: ${API_ENV:-/etc/hamtning/api.env}
    environment:
      # Garage is reached by service name inside the compose network; the browser uses
      # S3_PUBLIC_ENDPOINT from api.env.
      S3_ENDPOINT: http://garage:3900
    ports:
      - "127.0.0.1:3000:3000"
    # Run as the host's hamtning user, so the files in /var/lib/hamtning belong to it
    # (API_UID/API_GID in the .env next to this file; `id hamtning` shows them).
    user: "${API_UID:-1000}:${API_GID:-1000}"
    volumes:
      # Host folders, not named volumes, so deploy/backup/*.sh find the data where they expect it.
      - /var/lib/hamtning:/data
    depends_on:
      garage:
        condition: service_started
    stop_grace_period: 15s

  garage:
    image: dxflrs/garage:v2.4.1
    restart: unless-stopped
    environment:
      RUST_LOG: garage=warn
    command: ["/garage", "-c", "/etc/garage.toml", "server"]
    ports:
      - "127.0.0.1:3900:3900"
    volumes:
      - ${GARAGE_CONFIG:-/etc/garage.toml}:/etc/garage.toml:ro
      - /var/lib/garage/meta:/var/lib/garage/meta
      - /var/lib/garage/data:/var/lib/garage/data
