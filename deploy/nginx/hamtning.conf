# Nginx for the pickup app. Rendered by deploy/nginx/render.sh, which replaces:
#   __APP_DOMAIN__  the site, e.g. hamta.example.se
#   __S3_DOMAIN__   the photo storage host the browser talks to, e.g. s3.hamta.example.se
#   __WEB_ROOT__    the built web app (a symlink to the current release)
#   __CERT_DIR__    where certbot put the certificates (/etc/letsencrypt/live/__APP_DOMAIN__)
#   __API__         the API address (127.0.0.1:3000)
#   __GARAGE__      Garage's S3 address (127.0.0.1:3900)
#   __SNIPPETS__    where the two included snippets live (/etc/nginx/snippets)
#   __LOG_DIR__, __HTTP_PORT__, __HTTPS_PORT__  only changed by the local test

# Reuse connections to the API and Garage instead of opening one per request. Without this, each
# request leaves a local port waiting to be freed, and at a few hundred requests per second the
# server runs out of them (found by the load test, loadtest/). Idle connections are closed after
# 4 s, before Node's own 5 s timeout, so nginx never reuses one the API has just closed.
upstream hamtning_api {
    server __API__;
    keepalive 32;
    keepalive_timeout 4s;
}
upstream hamtning_garage {
    server __GARAGE__;
    keepalive 16;
    keepalive_timeout 4s;
}

# Rate limits per client IP, on top of the API's own. Bursts allow normal use (a customer
# uploading 8 photos, an admin clicking around) while slowing down scripted abuse.
limit_req_zone $binary_remote_addr zone=hamtning_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=hamtning_submit:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=hamtning_login:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=hamtning_presign:10m rate=30r/m;
limit_req_status 429;

# Status-page links carry an access token (/arende/<token>, /bekrafta/<token> and the API's
# /by-token/<token>). Anyone with the token can view or cancel the request, so it is
# replaced before the URL is written to the access log.
map $request_uri $hamtning_log_uri {
    "~^(?<hamtning_pre>.*/(?:arende|bekrafta|by-token)/)[^/?]+(?<hamtning_post>.*)$" "${hamtning_pre}[token]${hamtning_post}";
    default $request_uri;
}
log_format hamtning '$remote_addr [$time_local] "$request_method $hamtning_log_uri $server_protocol" '
                    '$status $body_bytes_sent $request_time';

server {
    listen __HTTP_PORT__;
    listen [::]:__HTTP_PORT__;
    server_name __APP_DOMAIN__ __S3_DOMAIN__;
    access_log __LOG_DIR__/hamtning.access.log hamtning;

    # certbot renews over plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen __HTTPS_PORT__ ssl;
    listen [::]:__HTTPS_PORT__ ssl;
    http2 on;
    server_name __APP_DOMAIN__;

    ssl_certificate __CERT_DIR__/fullchain.pem;
    ssl_certificate_key __CERT_DIR__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:hamtning_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log __LOG_DIR__/hamtning.access.log hamtning;
    server_tokens off;

    root __WEB_ROOT__;
    index index.html;

    # The web app. Unknown paths go to index.html; React Router handles them.
    location / {
        try_files $uri /index.html;
        include __SNIPPETS__/hamtning-headers.conf;
        # index.html must never be cached, or a deploy wouldn't reach returning visitors.
        add_header Cache-Control "no-cache" always;
    }

    # Vite puts a content hash in every file name here, so they can be cached for good.
    location /assets/ {
        try_files $uri =404;
        include __SNIPPETS__/hamtning-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # The API sets its own security headers (Hono secureHeaders).
    location /api/ {
        limit_req zone=hamtning_api burst=40 nodelay;
        include __SNIPPETS__/hamtning-proxy.conf;
    }

    location = /api/requests {
        limit_req zone=hamtning_submit burst=5 nodelay;
        include __SNIPPETS__/hamtning-proxy.conf;
    }

    location = /api/uploads/presign {
        limit_req zone=hamtning_presign burst=16 nodelay;
        include __SNIPPETS__/hamtning-proxy.conf;
    }

    location = /api/auth/login {
        limit_req zone=hamtning_login burst=5 nodelay;
        include __SNIPPETS__/hamtning-proxy.conf;
    }

    # Live updates for the admin (Server-Sent Events): no buffering, long-lived connection.
    location = /api/admin/notifications/stream {
        include __SNIPPETS__/hamtning-proxy.conf;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}

# Photo storage (Garage). Browsers upload straight here with presigned URLs, and the admin
# shows photos from here. Garage checks the signatures and the bucket's CORS rules itself.
server {
    listen __HTTPS_PORT__ ssl;
    listen [::]:__HTTPS_PORT__ ssl;
    http2 on;
    server_name __S3_DOMAIN__;

    ssl_certificate __CERT_DIR__/fullchain.pem;
    ssl_certificate_key __CERT_DIR__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:hamtning_ssl:10m;

    access_log __LOG_DIR__/hamtning-s3.access.log hamtning;
    server_tokens off;

    # Photos are at most 10 MB (MAX_IMAGE_BYTES); the presigned URL pins the exact size too.
    client_max_body_size 11m;

    location / {
        proxy_pass http://hamtning_garage;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # The signature covers the Host header, so pass it on exactly as the browser sent it.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_request_buffering off;
        proxy_buffering off;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
