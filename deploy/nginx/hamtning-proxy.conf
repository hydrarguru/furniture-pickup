# Shared settings for every /api location.
proxy_pass http://hamtning_api;
# HTTP/1.1 without "Connection: close", so the upstream keepalive pool is used.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
# Required: the API's rate limits and IP hashing read the client address from this header.
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
# Nothing the API accepts is larger (photos go to storage); the API enforces the same limit.
client_max_body_size 1m;
