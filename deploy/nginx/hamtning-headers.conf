# Security headers for the web app. Included in each location because nginx drops inherited
# add_header lines as soon as a location adds its own.
#
# CSP: Altcha (spam check) is bundled with the app; its proof-of-work runs in blob workers. Photos
# are uploaded to and shown from the storage host. The HEIC converter also runs in a blob worker.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; connect-src 'self' https://__S3_DOMAIN__; img-src 'self' blob: data: https://__S3_DOMAIN__ https://tile.openstreetmap.org; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
# Status-page URLs contain the access token: never send them to another site.
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
