# Garage inside Docker (docker-compose.yml). Same as deploy/garage/garage.toml, except it listens
# on all container interfaces; compose publishes the S3 port on the host's 127.0.0.1 only.
# deploy/docker/init.sh fills in the three secrets on first setup.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_factor = 1
metadata_auto_snapshot_interval = "6h"

rpc_bind_addr = "0.0.0.0:3901"
rpc_public_addr = "127.0.0.1:3901"
rpc_secret = "__RPC_SECRET__"

[s3_api]
s3_region = "garage"
api_bind_addr = "0.0.0.0:3900"

[admin]
api_bind_addr = "0.0.0.0:3903"
admin_token = "__ADMIN_TOKEN__"
metrics_token = "__METRICS_TOKEN__"
